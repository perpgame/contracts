[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
gas_reports = ["AgentTreasury", "AgentCurve"]

[rpc_endpoints]
hyperevm = "${HYPEREVM_RPC_URL}"
hyperevm_testnet = "${HYPEREVM_TESTNET_RPC_URL}"

[etherscan]
hyperevm = { key = "${HYPEREVM_VERIFIER_API_KEY}", url = "${HYPEREVM_VERIFIER_URL}" }
